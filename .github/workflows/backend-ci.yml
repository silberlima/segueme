name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

      - name: Unit tests
        run: ./mvnw -B test

      - name: Integration tests
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t segueme-backend:${{ github.sha }} .

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

      - name: Unit tests
        run: ./mvnw -B test

      # `verify` roda os testes de integração (Testcontainers) e, na sequência, o gate de
      # cobertura do JaCoCo — mínimo de 80% (skills/09). O build falha abaixo disso.
      - name: Integration tests and coverage gate
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build -t segueme-backend:${{ github.sha }} .

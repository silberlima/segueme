spring:
  application:
    name: segueme
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pos-encontro:
    # Régua de corte das faixas de prioridade (RN-POS-03). Percentual de presenças nos encontros
    # pós realizados no período. A régua exata é pendência #14 de docs/pendencias-gerais.md — estes
    # valores são o default documentado, coerente com os exemplos do doc (12/12 = Alta, 3/12 = Baixa),
    # e devem ser reajustados por configuração quando o PO validar a régua.
    regua:
      percentual-minimo-alta: ${POS_ENCONTRO_PERCENTUAL_MINIMO_ALTA:75}
      percentual-minimo-media: ${POS_ENCONTRO_PERCENTUAL_MINIMO_MEDIA:40}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
  # Sem estes dois, o Prometheus recebe só contadores: a métrica de latência vem como soma/contagem
  # e não dá para perguntar "qual o p95 do endpoint X" — que é o que o dashboard e os alertas de
  # `observabilidade/` usam. A tag `application` separa as séries por serviço no mesmo Prometheus.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
